<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✈️ Niko's Aviation Wish List 🛩️</title>
  <style>
    :root {
      --bg-color: #0b1922;
      --card-bg: #132736;
      --card-border: #1f3d54;
      --accent-blue: #3b82c9;
      --accent-blue-hover: #2d6ab0;
      --accent-gold: #e2b442;
      --text-main: #f3f7f4;
      --text-muted: #9eb8a7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .subhead {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 25px;
    }

    .form-card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--accent-gold);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    input, select {
      width: 100%;
      background: #071118;
      border: 1px solid var(--card-border);
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      outline: 1px solid var(--accent-gold);
    }

    .radio-group {
      display: flex;
      gap: 16px;
      align-items: center;
      background: #071118;
      border: 1px solid var(--card-border);
      padding: 10px;
      border-radius: 6px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .radio-option input { width: auto; cursor: pointer; }

    .form-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-submit {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-submit:hover { background: var(--accent-blue-hover); }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
    }

    .item-card.is-top {
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 14px rgba(226, 180, 66, 0.35);
    }

    .item-thumb-box {
      width: 100%;
      height: 180px;
      background: #050d12;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-thumb-box .placeholder {
      font-size: 2.5rem;
    }

    .item-body {
      padding: 14px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .priority-selector {
      background: #071118;
      border: 1px solid var(--card-border);
      color: white;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .item-title a {
      color: var(--text-main);
      text-decoration: none;
    }

    .item-title a:hover { text-decoration: underline; }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .item-notes {
      font-size: 0.85rem;
      color: #b5c7bc;
      margin-bottom: 12px;
      flex-grow: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>✈️ Niko's Aviation Wish List 🛩️</h1>
    <div class="subhead">Add your aviation gear and wishlist ideas!</div>
  </header>

  <div class="form-card">
    <h2>Add an Item</h2>
    <div class="form-grid">
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Product Link (URL)</label>
        <input type="url" id="input-url" placeholder="https://..." onblur="autoFetchMetadata()">
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Item Name</label>
        <input type="text" id="input-title" placeholder="e.g., Flight Simulator Yoke" required>
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Estimated Price</label>
        <input type="text" id="input-price" placeholder="e.g., $40 - $50">
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Specifics (Size, Model, Notes)</label>
        <input type="text" id="input-notes" placeholder="Compatible with PC/USB">
      </div>

      <div style="grid-column: 1 / -1;">
        <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Priority Level (Required)</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="priority" value="top" checked> 🤩 Top Choice</label>
          <label class="radio-option"><input type="radio" name="priority" value="medium"> 😁 Medium</label>
          <label class="radio-option"><input type="radio" name="priority" value="regular"> 🙂 Regular</label>
        </div>
      </div>

      <input type="hidden" id="input-image" value="">
    </div>

    <div class="form-actions">
      <button class="btn-submit" onclick="submitNewItem()">Add to Wishlist</button>
    </div>
  </div>

  <div class="items-grid" id="items-container">
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
      Loading wish list...
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxLclC8Li65MnALdSPGWnm5b473PkBwJUUbUVQzwV7eh2bFw6DQuRReJ_G12ec4DNIM/exec";

  let allItems = [];

  async function loadData() {
    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`);
      const data = await res.json();
      allItems = (data.items || []).map(normalizeItem);
      renderList();
    } catch (err) {
      console.error("Failed to load wishlist:", err);
      document.getElementById("items-container").innerHTML =
        `<div style="grid-column: 1 / -1; text-align: center; color: #ff6b6b;">
           Failed to connect to sheet. Please check script deployment.
         </div>`;
    }
  }

  function normalizeItem(raw) {
    return {
      id: String(raw.item_id || ""),
      title: String(raw.item_title || "Untitled"),
      url: String(raw.item_url || ""),
      image: String(raw.image_url || ""),
      price: String(raw.price_range || ""),
      notes: String(raw.notes || ""),
      priority: String(raw.priority || "regular").toLowerCase()
    };
  }

  async function autoFetchMetadata() {
    const urlInput = document.getElementById("input-url").value.trim();
    if (!urlInput || !urlInput.startsWith("http")) return;

    try {
      const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(urlInput)}`);
      const json = await res.json();
      if (json.status === "success" && json.data) {
        const titleEl = document.getElementById("input-title");
        const imgInput = document.getElementById("input-image");

        if (!titleEl.value && json.data.title) {
          titleEl.value = json.data.title.substring(0, 80);
        }
        if (json.data.image && json.data.image.url) {
          imgInput.value = json.data.image.url;
        }
      }
    } catch (e) {
      console.log("Could not auto-scrape URL metadata", e);
    }
  }

  async function submitNewItem() {
    const title = document.getElementById("input-title").value.trim();
    const url = document.getElementById("input-url").value.trim();
    const price = document.getElementById("input-price").value.trim();
    const notes = document.getElementById("input-notes").value.trim();
    const priorityRadio = document.querySelector('input[name="priority"]:checked');
    const priority = priorityRadio ? priorityRadio.value : "regular";
    const image = document.getElementById("input-image").value.trim();

    if (!title) {
      alert("Please provide an item name.");
      return;
    }

    const tempId = "wl-" + Date.now();
    const newItem = {
      id: tempId,
      title: title,
      url: url,
      image: image,
      price: price,
      notes: notes,
      priority: priority
    };

    allItems.unshift(newItem);
    renderList();

    document.getElementById("input-title").value = "";
    document.getElementById("input-url").value = "";
    document.getElementById("input-price").value = "";
    document.getElementById("input-notes").value = "";
    document.getElementById("input-image").value = "";

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "add",
          item: {
            item_title: title,
            item_url: url,
            image_url: image,
            price_range: price,
            notes: notes,
            priority: priority
          }
        })
      });
    } catch (e) {
      console.warn("Sync failed:", e);
    }
  }

  async function updateItemPriority(itemId, newPriority) {
    const target = allItems.find(i => i.id === itemId);
    if (target) {
      target.priority = newPriority;
    }
    renderList();

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "update_priority",
          item_id: itemId,
          priority: newPriority
        })
      });
    } catch (e) {
      console.warn("Priority update sync failed:", e);
    }
  }

  function renderList() {
    const container = document.getElementById("items-container");
    container.innerHTML = "";

    if (allItems.length === 0) {
      container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">No items added yet. Add your first item above!</div>`;
      return;
    }

    allItems.forEach(item => {
      const card = document.createElement("div");
      card.className = `item-card ${item.priority === 'top' ? 'is-top' : ''}`;

      const thumb = item.image
        ? `<img src="${item.image}" alt="${item.title}" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>✈️</div>'">`
        : `<div class="placeholder">✈️</div>`;

      let emojiDisplay = "🙂";
      let emojiStyle = "font-size: 1rem;";
      if (item.priority === 'top') {
        emojiDisplay = "🤩";
        emojiStyle = "font-size: 1.5rem;";
      } else if (item.priority === 'medium') {
        emojiDisplay = "😁";
        emojiStyle = "font-size: 1.25rem;";
      }

      card.innerHTML = `
        <div class="item-thumb-box">${thumb}</div>
        <div class="item-body">
          <div class="item-header">
            <div style="${emojiStyle}">${emojiDisplay}</div>
            <select class="priority-selector" onchange="updateItemPriority('${item.id}', this.value)">
              <option value="top" ${item.priority === 'top' ? 'selected' : ''}>🤩 Top Choice</option>
              <option value="medium" ${item.priority === 'medium' ? 'selected' : ''}>😁 Medium</option>
              <option value="regular" ${item.priority === 'regular' ? 'selected' : ''}>🙂 Regular</option>
            </select>
          </div>
          <div class="item-title">
            ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>` : item.title}
          </div>
          <div class="item-meta">
            <span>${item.price ? item.price : "Price unlisted"}</span>
            ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener" style="color: var(--accent-gold); text-decoration: none;">View Store ↗</a>` : ""}
          </div>
          ${item.notes ? `<div class="item-notes">${item.notes}</div>` : ""}
        </div>
      `;
      container.appendChild(card);
    });
  }

  loadData();
</script>

</body>
</html>
