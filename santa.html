<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko's Wish List | Air Traffic Control (Adult Portal)</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b132b;
            --panel-bg: #1c2541;
            --card-bg: #223055;
            --accent-blue: #3a86ff;
            --accent-gold: #ffd166;
            --accent-green: #38a3a5;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
            --danger: #ef476f;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 10%, #1c2541 0%, #0b132b 90%);
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 30px 20px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(56, 163, 165, 0.2);
        }
        header h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.3rem;
            margin: 0;
            color: var(--accent-green);
            letter-spacing: 2px;
        }
        header p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .filter-panel {
            background: var(--panel-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }
        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }
        select {
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: var(--text-main);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
        }
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .item-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.2s;
        }
        .item-card.purchased {
            opacity: 0.65;
            border-color: #334155;
            background: #171f38;
        }
        .item-card.top-choice:not(.purchased) {
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px rgba(255, 209, 102, 0.3);
        }
        .item-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #0f172a;
        }
        .item-content {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .priority-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .badge-top { background: rgba(255, 209, 102, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .badge-medium { background: rgba(58, 134, 255, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .badge-regular { background: rgba(141, 153, 174, 0.2); color: var(--text-muted); border: 1px solid var(--text-muted); }
        
        .item-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: var(--text-main);
        }
        .item-price {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-green);
            font-size: 1.1rem;
            margin-bottom: 6px;
        }
        .item-notes {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex: 1;
        }
        .purchase-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-top: auto;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .checkbox-wrapper input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-green);
            cursor: pointer;
        }
        .purchased-info {
            font-size: 0.85rem;
            color: var(--accent-green);
            margin-top: 6px;
            font-family: 'Share Tech Mono', monospace;
        }
        .item-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-link {
            flex: 1;
            background: #0f172a;
            color: var(--accent-blue);
            text-align: center;
            padding: 6px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #334155;
        }
        .btn-link:hover { background: var(--accent-blue); color: white; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 43, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        .modal-card {
            background: var(--panel-bg);
            border: 2px solid var(--danger);
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(239, 71, 111, 0.4);
        }
        .modal-card img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--danger);
            margin-bottom: 15px;
        }
        .modal-card h3 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--danger);
            font-size: 1.8rem;
            margin: 0 0 10px 0;
        }
        .modal-card p {
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        .btn-confirm-modal { background: var(--danger); color: white; width: 100%; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📡 AIR TRAFFIC CONTROL (ADULT PORTAL) 📡</h1>
            <p>Secure Flight Tracking & Grandparent Safeguard Console</p>
        </header>

        <div class="filter-panel">
            <div class="filter-group">
                <label>Filter by Priority</label>
                <select id="filterPriority" onchange="filterAndRender()">
                    <option value="all">All Priorities</option>
                    <option value="top">🤩 Top Choice</option>
                    <option value="medium">😁 Medium Want</option>
                    <option value="regular">🙂 Regular</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Filter by Price Range</label>
                <select id="filterPrice" onchange="filterAndRender()">
                    <option value="all">All Prices</option>
                    <option value="under25">Under $25</option>
                    <option value="25to50">$25 - $50</option>
                    <option value="50plus">$50+</option>
                </select>
            </div>
        </div>

        <div id="wishlistContainer" class="loading">Scanning radar for Niko's flight items...</div>
    </div>

    <!-- Grandparent Safeguard Uncheck Modal -->
    <div class="modal-overlay" id="uncheckModal">
        <div class="modal-card">
            <img src="jen_emoji_no_earrings.jpg" alt="Jenn" onerror="this.src='https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=300&q=80'">
            <h3>HOLD UP, JENN!</h3>
            <p>Need to change or uncheck a purchase?<br><br><strong>Please text or call directly!</strong><br>This prevents accidental ground collisions and duplicate gear purchases.</p>
            <button class="modal-btn btn-confirm-modal" onclick="closeModal()">Copy That, Over & Out</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxLclC8Li65MnALdSPGWnm5b473PkBwJUUbUVQzwV7eh2bFw6DQuRReJ_G12ec4DNIM/exec';
        let allItems = [];

        async function fetchWishlist() {
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                if (result.status === 'success') {
                    allItems = result.data;
                    filterAndRender();
                } else {
                    document.getElementById('wishlistContainer').innerHTML = '<p style="color:var(--danger)">Error loading telemetry.</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('wishlistContainer').innerHTML = '<p style="color:var(--danger)">Radar signal lost.</p>';
            }
        }

        function filterAndRender() {
            const container = document.getElementById('wishlistContainer');
            const priorityFilter = document.getElementById('filterPriority').value;
            const priceFilter = document.getElementById('filterPrice').value;

            let filtered = allItems.filter(item => {
                if (priorityFilter !== 'all' && item.priority !== priorityFilter) return false;
                
                if (priceFilter !== 'all') {
                    const priceStr = item.price_range || '';
                    const numbers = priceStr.match(/\d+/g);
                    if (numbers && numbers.length > 0) {
                        const maxVal = Math.max(...numbers.map(Number));
                        if (priceFilter === 'under25' && maxVal >= 25) return false;
                        if (priceFilter === '25to50' && (maxVal < 25 || maxVal > 50)) return false;
                        if (priceFilter === '50plus' && maxVal <= 50) return false;
                    }
                }
                return true;
            });

            // Sort: Unpurchased items first, purchased items at the bottom.
            filtered.sort((a, b) => {
                const aPurchased = String(a.purchased).toLowerCase() === 'true';
                const bPurchased = String(b.purchased).toLowerCase() === 'true';
                if (aPurchased !== bPurchased) return aPurchased ? 1 : -1;

                const priorityWeight = { top: 3, medium: 2, regular: 1 };
                const pA = priorityWeight[a.priority] || 1;
                const pB = priorityWeight[b.priority] || 1;
                return pB - pA;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="loading">No matching flight items found on radar.</p>';
                return;
            }

            container.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'wishlist-grid';

            filtered.forEach(item => {
                const isPurchased = String(item.purchased).toLowerCase() === 'true';
                const isTop = item.priority === 'top';
                const card = document.createElement('div');
                card.className = `item-card ${isPurchased ? 'purchased' : ''} ${isTop && !isPurchased ? 'top-choice' : ''}`;

                let badgeHtml = '';
                if (item.priority === 'top') badgeHtml = '<span class="priority-badge badge-top">🤩 Top Choice</span>';
                else if (item.priority === 'medium') badgeHtml = '<span class="priority-badge badge-medium">😁 Medium Want</span>';
                else badgeHtml = '<span class="priority-badge badge-regular">🙂 Regular</span>';

                const thumb = item.image_url ? item.image_url : 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=600&q=80';

                card.innerHTML = `
                    <img src="${thumb}" class="item-thumb" alt="${item.item_title}" onerror="this.src='https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=600&q=80'">
                    <div class="item-content">
                        <div class="card-header-row">
                            ${badgeHtml}
                        </div>
                        <h3 class="item-title">${item.item_title}</h3>
                        <div class="item-price">${item.price_range || 'Price TBD'}</div>
                        <div class="item-notes">${item.notes || 'No special notes'}</div>
                        
                        <div class="purchase-box">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" ${isPurchased ? 'checked' : ''} onchange="handlePurchaseToggle(event, '${item.item_id}', ${isPurchased}, '${item.purchased_by || ''}')">
                                <span>${isPurchased ? 'Cleared / Purchased' : 'Mark as Purchased'}</span>
                            </label>
                            ${isPurchased ? `<div class="purchased-info">Locked by: ${item.purchased_by}</div>` : ''}
                        </div>

                        <div class="item-actions">
                            ${item.item_url ? `<a href="${item.item_url}" target="_blank" class="btn-link">View Store ↗</a>` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        async function handlePurchaseToggle(event, itemId, wasPurchased, currentBuyer) {
            const checkbox = event.target;
            
            if (wasPurchased) {
                // Safeguard: unchecking is blocked, triggers Jenn's modal
                checkbox.checked = true;
                document.getElementById('uncheckModal').style.display = 'flex';
                return;
            }

            // Marking as purchased: prompt for shopper name with strict validation (default Jenn)
            let shopperName = prompt('Enter shopper name:', 'Jenn');
            if (shopperName === null) {
                checkbox.checked = false;
                return;
            }
            if (shopperName.trim() === '') {
                alert('Shopper name is required!');
                checkbox.checked = false;
                return;
            }

            checkbox.disabled = true;
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'update_purchase',
                        item_id: itemId,
                        purchased: true,
                        purchased_by: shopperName.trim()
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    fetchWishlist();
                } else {
                    alert('Failed to update status.');
                    checkbox.checked = false;
                }
            } catch (err) {
                alert('Connection error.');
                checkbox.checked = false;
            } finally {
                checkbox.disabled = false;
            }
        }

        function closeModal() {
            document.getElementById('uncheckModal').style.display = 'none';
        }

        fetchWishlist();
    </script>
</body>
</html>
